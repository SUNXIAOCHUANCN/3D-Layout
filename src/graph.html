<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoAgent 图视图</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0f1319;
        color: #c9d1d9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #root {
        height: 100%;
      }
      @keyframes coagent-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(76, 141, 255, 0.55);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(76, 141, 255, 0);
        }
      }
      .react-flow__attribution {
        display: none;
      }
      /* React Flow 自带样式是浅色的，这里压成与主应用一致的深色 */
      .react-flow__controls {
        box-shadow: none;
        border: 1px solid #30363d;
        border-radius: 6px;
        overflow: hidden;
      }
      .react-flow__controls-button {
        background: #161b22;
        border-bottom: 1px solid #30363d;
        color: #c9d1d9;
      }
      .react-flow__controls-button:hover {
        background: #1f2630;
      }
      .react-flow__controls-button svg {
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/modules/coagent/graph/main.tsx"></script>
  </body>
</html>
