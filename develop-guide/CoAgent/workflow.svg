<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540">
  <title>CoAgent 第一版工作流程</title>
  <desc>预处理后主 Agent 拆解任务，各区判定者先截图，全局基线屏障后执行者并行编辑，判定者复拍，有限修正后统一提交或回滚。</desc>
  <style>
    text { font-family: 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#111827; }
    .title { font-size:32px;font-weight:700; }
    .head { font-size:22px;font-weight:600; }
    .body { font-size:18px; }
    .small { font-size:16px;fill:#475569; }
    .node { stroke:#cbd5e1;stroke-width:1.5;rx:8; }
    .edge { fill:none;stroke:#2563eb;stroke-width:2.5; }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563eb"/></marker></defs>
  <rect width="1440" height="1540" fill="#fff"/>
  <text x="60" y="58" class="title">CoAgent · 第一版工作流程</text>
  <text x="60" y="92" class="body">编辑器内运行的独立插件 ｜ 多区并行推理 ｜ 一条用户指令，一个可撤销事务</text>

  <rect class="node" x="60" y="125" width="1320" height="100" fill="#eff6ff"/>
  <text x="88" y="160" class="head">01 预处理：建立分区与观测入口</text>
  <text x="88" y="192" class="body">鸟瞰图＋全局对象 ID → VLM 输出多边形 → 程序分配对象 → 人工可修正 → 每区后台相机</text>
  <path class="edge" marker-end="url(#arrow)" d="M720 225 V265"/>

  <rect class="node" x="300" y="265" width="840" height="110" fill="#eff6ff"/>
  <text x="328" y="303" class="head">02 主 Agent：接收模糊需求，解释并拆成区内任务</text>
  <text x="328" y="336" class="body">观察用户视口／鸟瞰／区域摘要；输出目标条件、保留条件、完成标准</text>
  <text x="328" y="361" class="small">先解决歧义与计划校验；锁定编辑入口，跨区任务暂不覆盖</text>
  <path class="edge" marker-end="url(#arrow)" d="M510 375 V425 H350 V465"/>
  <path class="edge" marker-end="url(#arrow)" d="M930 375 V425 H1090 V465"/>
  <text x="140" y="420" class="small">区域 A · 任务与完成标准</text>
  <text x="1110" y="444" class="small">区域 B · 任务与完成标准</text>

  <rect class="node" x="130" y="465" width="440" height="100" fill="#f0fdfa"/>
  <text x="155" y="501" class="head">03A 判定 SubAgent：先截图</text>
  <text x="155" y="535" class="body">保存原始基线、相机参数、对象状态</text>
  <rect class="node" x="870" y="465" width="440" height="100" fill="#f0fdfa"/>
  <text x="895" y="501" class="head">03B 判定 SubAgent：先截图</text>
  <text x="895" y="535" class="body">保存原始基线、相机参数、对象状态</text>
  <path class="edge" marker-end="url(#arrow)" d="M350 565 V610"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 565 V610"/>

  <rect class="node" x="130" y="610" width="1180" height="65" fill="#f8fafc"/>
  <text x="720" y="650" class="head" text-anchor="middle">基线屏障：全部取证完成 → 调度器开启唯一总事务 → 放行执行</text>
  <path class="edge" marker-end="url(#arrow)" d="M350 675 V725"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 675 V725"/>

  <rect class="node" x="130" y="725" width="440" height="105" fill="#eff6ff"/>
  <text x="155" y="760" class="head">04A 执行 SubAgent：修改本区</text>
  <text x="155" y="792" class="body">结构化编辑＋RGB／ID／聚焦</text>
  <text x="155" y="816" class="small">调用增改删与 mesh 碰撞检查工具</text>
  <rect class="node" x="870" y="725" width="440" height="105" fill="#eff6ff"/>
  <text x="895" y="760" class="head">04B 执行 SubAgent：修改本区</text>
  <text x="895" y="792" class="body">结构化编辑＋RGB／ID／聚焦</text>
  <text x="895" y="816" class="small">调用增改删与 mesh 碰撞检查工具</text>
  <text x="720" y="760" class="head" text-anchor="middle">并行调用</text>
  <text x="720" y="792" class="small" text-anchor="middle">共享写队列</text>
  <text x="720" y="817" class="small" text-anchor="middle">串行落地修改</text>
  <path class="edge" marker-end="url(#arrow)" d="M350 830 V890"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 830 V890"/>

  <rect class="node" x="130" y="890" width="440" height="105" fill="#f0fdfa"/>
  <text x="155" y="925" class="head">05A 判定者：同视角再次截图</text>
  <text x="155" y="957" class="body">前后对比＋几何结果＋目标条件</text>
  <text x="155" y="981" class="small">返回通过／失败／证据不足与具体原因</text>
  <rect class="node" x="870" y="890" width="440" height="105" fill="#f0fdfa"/>
  <text x="895" y="925" class="head">05B 判定者：同视角再次截图</text>
  <text x="895" y="957" class="body">前后对比＋几何结果＋目标条件</text>
  <text x="895" y="981" class="small">返回通过／失败／证据不足与具体原因</text>
  <path class="edge" marker-end="url(#arrow)" d="M130 943 H80 V778 H130"/>
  <path class="edge" marker-end="url(#arrow)" d="M1310 943 H1360 V778 H1310"/>
  <text x="102" y="859" class="small">修正</text>
  <text x="1295" y="859" class="small">修正</text>
  <text x="720" y="929" class="small" text-anchor="middle">有限重试</text>
  <text x="720" y="958" class="small" text-anchor="middle">原始基线不覆盖</text>
  <path class="edge" marker-end="url(#arrow)" d="M350 995 V1050"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 995 V1050"/>

  <rect class="node" x="130" y="1050" width="1180" height="85" fill="#f8fafc"/>
  <text x="720" y="1085" class="head" text-anchor="middle">06 汇合：等待全部区域结束，暂停写入，检查最终一致性</text>
  <text x="720" y="1115" class="body" text-anchor="middle">汇总判定；必要时复查受并行变化影响的证据与边界</text>
  <path class="edge" marker-end="url(#arrow)" d="M350 1135 V1200"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 1135 V1200"/>
  <text x="370" y="1175" class="small">全部通过</text>
  <text x="1110" y="1175" class="small">失败／停止／异常</text>

  <rect class="node" x="130" y="1200" width="440" height="95" fill="#f0fdf4"/>
  <text x="155" y="1236" class="head">统一提交</text>
  <text x="155" y="1271" class="body">一次历史记录，支持整体撤销／重做</text>
  <rect class="node" x="870" y="1200" width="440" height="95" fill="#fef2f2"/>
  <text x="895" y="1236" class="head">停止全部写入，整体回滚</text>
  <text x="895" y="1271" class="body">失效运行令牌，拒绝迟到工具调用</text>
  <path class="edge" marker-end="url(#arrow)" d="M350 1295 V1350"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 1295 V1350"/>
  <rect class="node" x="130" y="1350" width="1180" height="85" fill="#f8fafc"/>
  <text x="720" y="1385" class="head" text-anchor="middle">07 主 Agent 汇报结果，释放编辑锁，允许导出完整日志</text>
  <text x="720" y="1416" class="body" text-anchor="middle">用户需求 · 单元任务 · 工具操作 · 前后截图 · 判定证据 · 提交／回滚记录</text>
  <text x="60" y="1480" class="small">蓝色节点：规划／执行　青色节点：独立判定取证　灰色节点：确定性调度　绿色／红色：结束分支</text>
  <text x="60" y="1510" class="small">v0.1 设计稿 · 2026-10-20 ｜ 屏障、有限修正与失败全回滚为建议默认策略，详见 README</text>
</svg>
